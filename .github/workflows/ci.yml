name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Compile Python surfaces
        run: python -m compileall -q blender_extension examples device_agent scripts

  web:
    name: Web control center
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://nexora-forge.example.com
        run: npm run build
